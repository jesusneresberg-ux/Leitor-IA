name: APK Android (LUME)

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.txt'
      - '**.md'
      - 'upgrade_lume.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar arquivos do app
        run: bash android-build/prepare-www.sh

      - name: Gerar projeto Android (Capacitor)
        working-directory: android-build
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

      - name: Definir versão
        working-directory: android-build/android/app
        run: |
          sed -i "s/versionCode [0-9]\+/versionCode ${{ github.run_number }}/" build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/" build.gradle
          grep -E "versionCode|versionName" build.gradle

      - name: Compilar APK
        working-directory: android-build/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Assinar APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IN=android-build/android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -p -f 4 "$IN" aligned.apk
          "$BT/apksigner" sign --ks android-build/lume.keystore --ks-key-alias lume \
            --ks-pass pass:lume-apk-2026 --key-pass pass:lume-apk-2026 \
            --out "LUME-${VERSION_NAME}.apk" aligned.apk
          "$BT/apksigner" verify "LUME-${VERSION_NAME}.apk"
          ls -la LUME-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LUME-${{ env.VERSION_NAME }}
          path: LUME-*.apk

      - name: Publicar no GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: LUME ${{ env.VERSION_NAME }}
          body: |
            APK do LUME gerado automaticamente a partir do commit ${{ github.sha }}.
            Baixe o arquivo LUME-${{ env.VERSION_NAME }}.apk abaixo e instale no Android.
          files: LUME-*.apk
          make_latest: true
